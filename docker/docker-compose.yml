version: '3.8'

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: glass_ai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glassai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glassai_secret}
      POSTGRES_DB: ${POSTGRES_DB:-glass_expert_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-glassai} -d ${POSTGRES_DB:-glass_expert_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: glass_ai_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: glass_ai_api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-glassai}:${POSTGRES_PASSWORD:-glassai_secret}@postgres:5432/${POSTGRES_DB:-glass_expert_ai}
      REDIS_URL: redis://redis:6379
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - api_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: glass_ai_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@glassai.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
  api_logs:
